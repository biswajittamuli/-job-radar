# ─────────────────────────────────────────────────────────────────────────────
# Job Radar — companies to track
#
# Each entry reads a company's job board straight from its ATS (applicant
# tracking system) API, so there's no HTML scraping and no AI browsing.
#
#   ats: greenhouse | lever | ashby | smartrecruiters | workday | amazon | microsoft | google | oracle_hcm
#   slug: the board id (for greenhouse/lever/ashby/smartrecruiters)
#
# Don't know a company's ATS?  Run:
#   python -m radar detect https://company.com/careers
# and it prints the exact block to paste here.
#
# `verified:` = date the board was confirmed live. Unverified boards are
# health-checked on every run and show up under "Broken boards" on the
# dashboard if the slug is wrong, so you can fix or delete them.
# ─────────────────────────────────────────────────────────────────────────────

companies:
  # ── Indian product / fintech ──────────────────────────────────────────────
