name: Job Radar

on:
  schedule:
    # 4 runs a day: 07:05, 11:05, 15:05 and 19:05 IST (01:35/05:35/09:35/13:35 UTC).
    # Off the hour so GitHub doesn't delay it. Edit the hours list to change.
    - cron: "35 1,5,9,13 * * *"
  workflow_dispatch: {}        # "Run workflow" button for manual runs

permissions:
  contents: write              # commit data/ and docs/ back to the repo

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # the latest commit on the branch, not the one the run was queued on, so a run that
          # starts right after another one builds on its results
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan career boards
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          JOOBLE_KEY:         ${{ secrets.JOOBLE_KEY }}
          DASHBOARD_URL:      https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar run

      - name: Save results
        if: always()
        run: |
          git config user.name  "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          # This scan's data/ and docs/ always win. Copy them aside, move onto the latest
          # commit on the branch (another run or your own edit may have landed meanwhile,
          # e.g. deleting data/jobs.json), put them back, and push. No merge conflicts possible.
          out=$(mktemp -d)
          cp -r data docs "$out"/
          for i in 1 2 3 4; do
            git fetch -q origin "${{ github.ref_name }}"
            git reset -q --hard "origin/${{ github.ref_name }}"
            rm -rf data docs && cp -r "$out"/data "$out"/docs .
            git add -A data docs
            if git diff --cached --quiet; then echo "No changes."; exit 0; fi
            git commit -q -m "radar: $(date -u +'%Y-%m-%d %H:%M') scan"
            if git push -q origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error title=Save failed::could not push scan results after 4 attempts"
          exit 1

# Note: GitHub pauses scheduled workflows after 60 days without repo activity.
# Every run commits data/runs.json, so the repo stays active on its own.
