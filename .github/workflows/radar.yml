name: Job Radar

on:
  schedule:
    # 4 runs a day: 07:05, 11:05, 15:05 and 19:05 IST (01:35/05:35/09:35/13:35 UTC).
    # Off the hour so GitHub doesn't delay it. Edit the hours list to change.
    - cron: "35 1,5,9,13 * * *"
  workflow_dispatch: {}        # "Run workflow" button for manual runs

permissions:
  contents: write              # commit data/ and docs/ back to the repo

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # the latest commit on the branch, not the one the run was queued on, so a run that
          # starts right after another one builds on its results
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan career boards
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL:      https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar run

      - name: Save results
        if: always()
        run: |
          git config user.name  "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "radar: $(date -u +'%Y-%m-%d %H:%M') scan"
          # Another run (or your own push) may have landed meanwhile: replay this scan on top.
          # -X theirs keeps this run's data files if both touched them.
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error title=Save failed::could not push scan results after 4 attempts"
          exit 1

# Note: GitHub pauses scheduled workflows after 60 days without repo activity.
# Every run commits data/runs.json, so the repo stays active on its own.
