# Indian startups shown in the dashboard's "Indian startups" directory.
#
# tracked: companies in companies.yaml that are Indian startups. Their jobs are read
#          automatically; the directory shows their open fresher roles and every fresher /
#          intern role the radar has ever seen them list (data/companies.json).
# manual:  startups whose careers site Job Radar can't read (Darwinbox, Zoho Recruit,
#          TurboHire, their own page…). The dashboard links to them so you can check by hand.
#          If one moves to a supported system, `python -m radar add <url> --name X` tracks it.
